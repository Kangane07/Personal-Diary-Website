services:
  - type: web
    name: personal-diary-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: /var/data/diary.db
      - key: CLIENT_ORIGIN
        value: https://YOUR_GITHUB_USERNAME.github.io
    disk:
      name: diary-data
      mountPath: /var/data
      sizeGB: 1
